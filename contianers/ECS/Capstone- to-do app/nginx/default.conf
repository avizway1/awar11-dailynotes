# ---------------------------------------------------------------------------
# To-Do app - nginx front end
#
#   /            -> static files from /usr/share/nginx/html  (the EFS volume)
#   /api/...     -> reverse-proxied to the Node API on 127.0.0.1:3000
#   /healthz     -> container liveness, answered by nginx itself
#
# Replaces the stock /etc/nginx/conf.d/default.conf.
# ---------------------------------------------------------------------------

upstream todo_api {
    server 127.0.0.1:3000;

    # Keep a few connections open to the API instead of doing a TCP handshake
    # per request. Requires HTTP/1.1 + an empty Connection header below.
    keepalive 16;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # --- EFS-specific -------------------------------------------------------
    # sendfile() hands a file straight from the page cache to the socket. Over
    # NFS - which is what EFS is - that path is the classic source of truncated
    # or stale responses after a file is replaced. Turning it off costs one
    # memory copy and buys correctness.
    sendfile off;

    # Same reason: do not cache open file descriptors. When you update the site
    # on EFS you want the very next request to see the new file.
    open_file_cache off;
    # ------------------------------------------------------------------------

    client_max_body_size 1m;

    # Do not advertise the exact nginx version on error pages and headers.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    gzip              on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary         on;

    # Liveness. Never touches the API or DynamoDB, so it stays green while you
    # debug an IAM problem. Also the right target for an ALB health check.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API. proxy_pass without a URI part passes the original request URI
    # through unchanged, so /api/tasks?status=pending arrives intact.
    location /api/ {
        proxy_pass       http://todo_api;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # add_header does NOT merge with an outer block: the moment a location
        # declares one of its own, every add_header from the server block stops
        # applying here. So the three security headers are repeated rather than
        # inherited. This is the single most misunderstood rule in nginx.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN  always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;

        # The API is the source of truth; never serve a cached task list.
        add_header Cache-Control "no-store" always;
    }

    # index.html is revalidated every time, so a content update on EFS shows up
    # on the next refresh instead of whenever the browser feels like it.
    # `expires` is used rather than add_header precisely so the security headers
    # above keep applying here.
    location = /index.html {
        expires -1;
    }

    # Assets carry no fingerprint in their names, so keep the cache short.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
