apiVersion: v1
kind: LimitRange
metadata:
  name: myapp-limit
  namespace: myapp
spec:
  limits:
  - type: Container
    default:              #If we dont define any LIMITS at the container level, this will be picked
      cpu: "1"            #Max CPU contianer gets
      memory: "1Gi"       #Max Memory Container gets
    defaultRequest:      #If we dont define any REQUESTS at the container level, this will be picked
      cpu: "0.5"          #Default CPU we get, if we dont define REQUESTS at container level
      memory: "512Mi"     #Default Memory we get, if we dont define REQUESTS at container level