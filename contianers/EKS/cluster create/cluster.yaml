apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ekswithavinash
  region: ap-south-1
  version: "1.36"

availabilityZones:
  - ap-south-1a
  - ap-south-1b

managedNodeGroups:
  - name: myeksnodes
    instanceType: c7i-flex.large
    amiFamily: AmazonLinux2023
    desiredCapacity: 2
    minSize: 2
    maxSize: 5
